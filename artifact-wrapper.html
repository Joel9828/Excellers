<title>Excellers</title>
<style>
  /* The site itself is a complete static export published under app/. It is
     framed rather than inlined because it ships its own <html>/<head>/<body>,
     which a host skeleton would otherwise double-wrap. */
  :root {
    color-scheme: dark;
    --ground: #070708;
    padding: 0;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--ground);
  }

  .site {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--ground);
  }
</style>

<iframe
  class="site"
  src="app/index.html"
  title="Excellers — We Manifest"
  allow="fullscreen"
></iframe>
